name: opagram
services:
  web:
    image: nginx:alpine
    container_name: opagram-web
    restart: unless-stopped
    ports:
      - "127.0.0.1:8120:80"
    volumes:
      - ../dist:/usr/share/nginx/html:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    mem_limit: 64m

  tunnel:
    image: cloudflare/cloudflared:latest
    container_name: opagram-tunnel
    restart: unless-stopped
    # config.yml and the credentials file live outside the repo, in ~/opagram-tunnel
    command: tunnel --no-autoupdate --config /etc/cloudflared/config.yml run opagram
    volumes:
      - ${HOME}/opagram-tunnel:/etc/cloudflared:ro
    depends_on:
      - web
